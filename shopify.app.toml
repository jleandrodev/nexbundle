# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "NexBundle"
client_id = "b095b89486edb4b3212f323e8833dc64"
application_url = "https://nexbundle.sprezzia.live"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# NÃO deixar vazio: o config:link zera isto (gotcha #8). Buy Together só lê produtos.
scopes = "read_products"

[app_proxy]
# Produção na VPS (domínio fixo). O storefront chama nexbundle.sprezzia.live/apps/buy-together.
url = "https://nexbundle.sprezzia.live/apps/buy-together"
subpath = "buy-together"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Compliance GDPR (obrigatórios p/ App Store, mesmo sem coletar PII).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://nexbundle.sprezzia.live/auth/callback",
  "https://nexbundle.sprezzia.live/auth/shopify/callback",
  "https://nexbundle.sprezzia.live/api/auth/callback",
]

[build]
# false: rodar `shopify app dev` NÃO reescreve as URLs registradas (mantém a produção
# em nexbundle.sprezzia.live). Ver gotcha #17.
automatically_update_urls_on_dev = false
